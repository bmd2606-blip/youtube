<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Negro puro para quitar el fondo en edición */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: #000000;
      }
      #battery {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 780px;
        height: 360px;
        margin: -180px 0 0 -410px;
      }
      #glow {
        position: absolute;
        inset: -120px -160px;
        border-radius: 200px;
        background: radial-gradient(ellipse at center, rgba(48, 209, 88, 0.55) 0%, rgba(48, 209, 88, 0) 65%);
        opacity: 0;
      }
      #body {
        position: absolute;
        inset: 0;
        border-radius: 92px;
        border: 16px solid #e5e5ea;
        padding: 18px;
      }
      #fill-track {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        overflow: hidden;
      }
      #fill {
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: #e0342b;
        transform-origin: left center;
        transform: scaleX(0.01);
      }
      #nub {
        position: absolute;
        right: -44px;
        top: 50%;
        width: 30px;
        height: 120px;
        margin-top: -60px;
        border-radius: 0 22px 22px 0;
        background: #e5e5ea;
      }
      #label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #ffffff;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
      }
      #bolt {
        width: 96px;
        height: 150px;
      }
      #num {
        font-size: 176px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #pct {
        font-size: 90px;
        font-weight: 700;
        line-height: 1;
        margin-top: 40px;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 92px;
        border: 6px solid #30d158;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <div id="battery">
          <div id="glow"></div>
          <div id="ring" class="ring"></div>
          <div id="body">
            <div id="fill-track"><div id="fill"></div></div>
          </div>
          <div id="nub"></div>
          <div id="label">
            <svg id="bolt" viewBox="0 0 64 100">
              <path d="M38 0 L4 58 H30 L22 100 L60 38 H34 Z" fill="#ffffff" />
            </svg>
            <span id="num">1</span><span id="pct">%</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 24; // un fotograma
      const at = (i) => Math.max(0, i * F - 0.001);

      // f0–f4: la batería aparece con un pequeño rebote
      tl.fromTo("#battery", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 4 * F, ease: "back.out(2)" }, 0);
      tl.fromTo("#bolt", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 3 * F, ease: "back.out(3)" }, 2 * F);

      // f3–f18: carga de 1 % a 100 %, un valor por fotograma
      const FIRST = 3;
      const LAST = 18;
      const steps = LAST - FIRST;
      const ease = gsap.parseEase("power2.inOut");
      for (let i = FIRST; i <= LAST; i++) {
        const p = i === LAST ? 1 : Math.max(0.01, ease((i - FIRST) / steps));
        const n = i === FIRST ? 1 : Math.round(p * 100);
        const color = p < 0.2 ? "#e0342b" : p < 0.5 ? "#c77700" : "#1f9d45";
        tl.set("#fill", { scaleX: p, backgroundColor: color }, at(i));
        tl.set("#num", { textContent: String(n) }, at(i));
      }

      // f18–f24: 100 % → destello verde, onda y pequeño "latido"
      tl.fromTo("#glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.05, duration: 3 * F, ease: "power2.out" }, at(LAST));
      tl.fromTo("#ring", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.25, duration: 5 * F, ease: "power2.out", immediateRender: false }, at(LAST));
      tl.to("#battery", { scale: 1.06, duration: 2 * F, ease: "power2.out" }, at(LAST));
      tl.to("#battery", { scale: 1, duration: 3 * F, ease: "power2.inOut" }, at(LAST + 2));
      tl.to("#bolt", { scale: 1.25, duration: 2 * F, ease: "power2.out", yoyo: true, repeat: 1 }, at(LAST));

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
