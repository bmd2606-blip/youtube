<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07060b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Playfair Display", Georgia, serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, #1a1426 0%, #07060b 70%);
      }

      /* ---------- Manchas de color detrás del cristal ---------- */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
      }
      #blob-1 {
        width: 620px;
        height: 620px;
        left: 330px;
        top: 150px;
        background: radial-gradient(circle, #d4af37 0%, rgba(212, 175, 55, 0) 70%);
      }
      #blob-2 {
        width: 700px;
        height: 700px;
        left: 980px;
        top: 260px;
        background: radial-gradient(circle, #7b2cbf 0%, rgba(123, 44, 191, 0) 70%);
      }
      #blob-3 {
        width: 520px;
        height: 520px;
        left: 760px;
        top: -80px;
        background: radial-gradient(circle, #e0457b 0%, rgba(224, 69, 123, 0) 70%);
      }
      #blob-4 {
        width: 560px;
        height: 560px;
        left: 520px;
        top: 560px;
        background: radial-gradient(circle, #2f6bff 0%, rgba(47, 107, 255, 0) 70%);
      }

      /* ---------- Pantalla de cristal líquido ---------- */
      #stage {
        position: absolute;
        inset: 0;
        perspective: 1800px;
      }
      #screen {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1240px;
        height: 740px;
        margin: -370px 0 0 -620px;
        border-radius: 64px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 45%, rgba(255, 255, 255, 0.1) 100%);
        backdrop-filter: blur(28px) saturate(185%);
        -webkit-backdrop-filter: blur(28px) saturate(185%);
        border: 1.5px solid rgba(255, 255, 255, 0.28);
        box-shadow:
          inset 0 2px 1px rgba(255, 255, 255, 0.55),
          inset 0 -2px 1px rgba(255, 255, 255, 0.12),
          inset 0 0 60px rgba(255, 255, 255, 0.06),
          0 50px 140px rgba(0, 0, 0, 0.55);
      }
      /* Brillo especular del borde (efecto lente) */
      #rim {
        position: absolute;
        inset: 0;
        border-radius: 64px;
        padding: 2px;
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.5) 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      #shine {
        position: absolute;
        top: -20%;
        left: 0;
        width: 320px;
        height: 140%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }

      /* ---------- Contenido de la pantalla ---------- */
      #content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #crown {
        width: 250px;
        height: 173px;
        margin-bottom: 18px;
      }
      #crown .outline {
        fill: none;
        stroke: #f3d77a;
        stroke-width: 6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #crown-fill {
        opacity: 0;
      }
      .jewel {
        transform-box: fill-box;
        transform-origin: center;
      }
      #word {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #letters {
        font-size: 190px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1;
        color: #f8e7a6;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      #letters span {
        display: inline-block;
      }
      /* Censura: pastilla de cristal con asteriscos (las letras censuradas no existen en el DOM) */
      #censor {
        height: 150px;
        padding: 0 42px;
        display: flex;
        align-items: center;
        border-radius: 75px;
        background: rgba(10, 8, 16, 0.55);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.4), 0 12px 40px rgba(0, 0, 0, 0.4);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 120px;
        font-weight: 800;
        color: #f8e7a6;
        letter-spacing: 0.08em;
        line-height: 1;
        padding-top: 38px;
      }
      #luxury {
        display: flex;
        align-items: center;
        gap: 34px;
        margin-top: 44px;
      }
      .gold-line {
        width: 170px;
        height: 2px;
        background: linear-gradient(90deg, rgba(243, 215, 122, 0), #f3d77a);
      }
      #line-r {
        background: linear-gradient(270deg, rgba(243, 215, 122, 0), #f3d77a);
      }
      #line-l {
        transform-origin: right center;
      }
      #line-r {
        transform-origin: left center;
      }
      #diamond {
        width: 150px;
        height: 128px;
        filter: drop-shadow(0 0 18px rgba(170, 220, 255, 0.55));
      }
      .spark {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        background: radial-gradient(circle, #ffffff 0%, rgba(220, 240, 255, 0.9) 30%, rgba(220, 240, 255, 0) 70%);
        clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
        opacity: 0;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="blob-1" class="blob"></div>
        <div id="blob-2" class="blob"></div>
        <div id="blob-3" class="blob"></div>
        <div id="blob-4" class="blob"></div>

        <div id="stage">
          <div id="screen">
            <div id="rim"></div>
            <div id="shine"></div>
            <div id="content">
              <svg id="crown" viewBox="0 0 420 290">
                <defs>
                  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fbe9a0" />
                    <stop offset="0.5" stop-color="#d4af37" />
                    <stop offset="1" stop-color="#8a6a1c" />
                  </linearGradient>
                </defs>
                <g id="crown-fill">
                  <path d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" fill="url(#gold)" />
                  <rect x="62" y="200" width="296" height="46" rx="6" fill="url(#gold)" />
                  <path d="M210 8 V48 M194 24 H226" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
                </g>
                <g class="outline">
                  <path class="draw" pathLength="1" d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" />
                  <rect class="draw" pathLength="1" x="62" y="200" width="296" height="46" rx="6" />
                  <path class="draw" pathLength="1" d="M210 8 V48 M194 24 H226" />
                </g>
                <circle class="jewel" cx="45" cy="90" r="14" fill="#f6ecd2" />
                <circle class="jewel" cx="210" cy="60" r="14" fill="#f6ecd2" />
                <circle class="jewel" cx="375" cy="90" r="14" fill="#f6ecd2" />
                <circle class="jewel" cx="130" cy="223" r="12" fill="#b3243b" />
                <circle class="jewel" cx="210" cy="223" r="14" fill="#1f4fbf" />
                <circle class="jewel" cx="290" cy="223" r="12" fill="#b3243b" />
              </svg>

              <div id="word">
                <div id="letters"><span>D</span><span>R</span><span>O</span></div>
                <div id="censor">***</div>
              </div>

              <div id="luxury">
                <div id="line-l" class="gold-line"></div>
                <svg id="diamond" viewBox="0 0 200 170">
                  <polygon points="40,0 70,50 0,50" fill="#e8f6ff" />
                  <polygon points="40,0 100,0 70,50" fill="#bfe6ff" />
                  <polygon points="100,0 130,50 70,50" fill="#ffffff" />
                  <polygon points="100,0 160,0 130,50" fill="#a9dcff" />
                  <polygon points="160,0 200,50 130,50" fill="#d7efff" />
                  <polygon points="0,50 70,50 100,170" fill="#8fcdf5" />
                  <polygon points="70,50 130,50 100,170" fill="#cdeeff" />
                  <polygon points="130,50 200,50 100,170" fill="#6fb8e8" />
                </svg>
                <div id="line-r" class="gold-line"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="spark" style="left: 905px; top: 800px"></div>
        <div class="spark" style="left: 1015px; top: 770px"></div>
        <div class="spark" style="left: 960px; top: 255px"></div>
        <div class="spark" style="left: 830px; top: 300px"></div>
        <div class="spark" style="left: 1100px; top: 290px"></div>
        <div class="spark" style="left: 985px; top: 845px"></div>

        <div id="fade"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Manchas de color: movimiento lento continuo para que el cristal "respire"
      tl.fromTo("#blob-1", { x: 0, y: 0 }, { x: 260, y: 120, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-2", { x: 0, y: 0 }, { x: -300, y: -140, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-3", { x: 0, y: 0 }, { x: -180, y: 200, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-4", { x: 0, y: 0 }, { x: 320, y: -100, duration: 10, ease: "sine.inOut" }, 0);

      // Entrada de la pantalla
      tl.fromTo(
        "#screen",
        { opacity: 0, y: 90, scale: 0.88, rotationX: 14 },
        { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 1.3, ease: "power3.out" },
        0.2
      );
      tl.fromTo("#shine", { x: -500, skewX: -15 }, { x: 1600, skewX: -15, duration: 1.4, ease: "power2.inOut" }, 0.9);

      // Corona
      tl.fromTo("#crown .draw", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut", stagger: 0.12 }, 1.3);
      tl.to("#crown-fill", { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.2);
      tl.fromTo(".jewel", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)", stagger: 0.06 }, 2.3);
      tl.fromTo("#crown", { y: 20, scale: 0.9 }, { y: 0, scale: 1, duration: 1.4, ease: "power3.out" }, 1.3);

      // Palabra DRO + censura
      tl.fromTo("#letters span", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out", stagger: 0.08 }, 2.8);
      tl.fromTo("#censor", { opacity: 0, x: 60, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "back.out(2)" }, 3.3);

      // Lujo: diamante y líneas doradas
      tl.fromTo(".gold-line", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 4.0);
      tl.fromTo("#diamond", { opacity: 0, scale: 0, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(2.2)" }, 4.1);
      tl.to("#diamond", { y: -8, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5);

      // Destellos
      const sparkTimes = [4.6, 4.9, 5.4, 5.8, 6.6, 7.4];
      document.querySelectorAll(".spark").forEach((el, i) => {
        const t = sparkTimes[i];
        tl.fromTo(el, { opacity: 0, scale: 0.2, rotation: 0 }, { opacity: 1, scale: 1.5, rotation: 90, duration: 0.35, ease: "power2.out" }, t);
        tl.to(el, { opacity: 0, scale: 0.3, duration: 0.5, ease: "power2.in" }, t + 0.35);
      });

      // Flotación suave de la pantalla y segundo reflejo
      tl.to("#screen", { y: -14, rotationY: -4, rotationX: 3, duration: 4.5, ease: "sine.inOut" }, 4.2);
      tl.fromTo("#shine", { x: -500, skewX: -15 }, { x: 1600, skewX: -15, duration: 1.6, ease: "power2.inOut", immediateRender: false }, 6.4);

      // Salida
      tl.to("#fade", { opacity: 1, duration: 0.8, ease: "power1.in" }, 9.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
