<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Playfair Display", Georgia, serif;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ---------- Pantalla de cristal líquido (centrada) ---------- */
      #screen {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1800px;
        height: 1080px;
        margin: -540px 0 0 -900px;
        border-radius: 110px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(20, 18, 30, 0.35) 50%, rgba(255, 255, 255, 0.1) 100%);
        backdrop-filter: blur(60px) saturate(160%) brightness(0.5);
        -webkit-backdrop-filter: blur(60px) saturate(160%) brightness(0.5);
        border: 4px solid rgba(255, 255, 255, 0.32);
        box-shadow:
          inset 0 6px 3px rgba(255, 255, 255, 0.55),
          inset 0 -4px 3px rgba(255, 255, 255, 0.14),
          0 60px 180px rgba(0, 0, 0, 0.4);
      }
      #rim {
        position: absolute;
        inset: 0;
        border-radius: 110px;
        padding: 5px;
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.5) 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      #shine {
        position: absolute;
        top: -20%;
        left: 0;
        width: 520px;
        height: 140%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.24) 50%, rgba(255, 255, 255, 0) 100%);
      }

      /* ---------- Escenas dentro de la pantalla ---------- */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .caption {
        margin-top: 50px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: 0.4em;
        padding-left: 0.4em;
        color: #f8e7a6;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      /* 1 · Corona */
      #crown {
        width: 900px;
        height: 621px;
        filter: drop-shadow(0 0 50px rgba(243, 215, 122, 0.45));
      }
      #crown .outline {
        fill: none;
        stroke: #f3d77a;
        stroke-width: 6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #crown-fill {
        opacity: 0;
      }
      .jewel {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* 2 · DRO*** */
      #word {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      #letters {
        font-size: 300px;
        font-weight: 700;
        letter-spacing: 0.03em;
        line-height: 1;
        color: #f8e7a6;
        text-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
      }
      #letters span {
        display: inline-block;
      }
      /* Censura: las letras "GAS" no existen en el vídeo, solo la pastilla con *** */
      #censor {
        height: 240px;
        padding: 58px 70px 0;
        display: flex;
        align-items: center;
        border-radius: 120px;
        background: rgba(0, 0, 0, 0.55);
        border: 4px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 4px 2px rgba(255, 255, 255, 0.4), 0 20px 60px rgba(0, 0, 0, 0.4);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 180px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1;
        color: #f8e7a6;
      }

      /* 3 · Lujo: diamante */
      #diamond-wrap {
        position: relative;
        width: 700px;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rays {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        background: repeating-conic-gradient(from 0deg, rgba(255, 240, 200, 0.16) 0deg 6deg, rgba(255, 240, 200, 0) 6deg 24deg);
        -webkit-mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 65%);
        mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 65%);
      }
      #diamond {
        position: relative;
        width: 560px;
        height: 476px;
        filter: drop-shadow(0 0 60px rgba(170, 220, 255, 0.6));
      }
      .spark {
        position: absolute;
        width: 90px;
        height: 90px;
        margin: -45px 0 0 -45px;
        background: radial-gradient(circle, #ffffff 0%, rgba(220, 240, 255, 0.9) 30%, rgba(220, 240, 255, 0) 70%);
        clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.23"
      data-width="3840"
      data-height="2160"
    >
      <video
        id="clip"
        class="clip"
        src="assets/video/clip.mp4"
        data-start="0"
        data-duration="5.23"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio id="clip-audio" src="assets/video/clip.mp4" data-start="0" data-duration="5.23" data-track-index="10" data-volume="1"></audio>

      <div id="screen" class="clip" data-start="0" data-duration="5.23" data-track-index="1">
        <div id="rim"></div>
        <div id="shine" data-layout-allow-overflow></div>

        <!-- 1 · Corona -->
        <div id="s1" class="scene">
          <svg id="crown" viewBox="0 0 420 290">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fbe9a0" />
                <stop offset="0.5" stop-color="#d4af37" />
                <stop offset="1" stop-color="#8a6a1c" />
              </linearGradient>
            </defs>
            <g id="crown-fill">
              <path d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" fill="url(#gold)" />
              <rect x="62" y="200" width="296" height="46" rx="6" fill="url(#gold)" />
              <path d="M210 8 V48 M194 24 H226" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
            </g>
            <g class="outline">
              <path class="draw" pathLength="1" d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" />
              <rect class="draw" pathLength="1" x="62" y="200" width="296" height="46" rx="6" />
              <path class="draw" pathLength="1" d="M210 8 V48 M194 24 H226" />
            </g>
            <circle class="jewel" cx="45" cy="90" r="14" fill="#f6ecd2" />
            <circle class="jewel" cx="210" cy="60" r="14" fill="#f6ecd2" />
            <circle class="jewel" cx="375" cy="90" r="14" fill="#f6ecd2" />
            <circle class="jewel" cx="130" cy="223" r="12" fill="#b3243b" />
            <circle class="jewel" cx="210" cy="223" r="14" fill="#1f4fbf" />
            <circle class="jewel" cx="290" cy="223" r="12" fill="#b3243b" />
          </svg>
        </div>

        <!-- 2 · DRO*** -->
        <div id="s2" class="scene">
          <div id="word">
            <div id="letters"><span>D</span><span>R</span><span>O</span></div>
            <div id="censor">***</div>
          </div>
        </div>

        <!-- 3 · Lujo -->
        <div id="s3" class="scene">
          <div id="diamond-wrap">
            <div id="rays" data-layout-allow-overflow></div>
            <svg id="diamond" viewBox="0 0 200 170">
              <polygon points="40,0 70,50 0,50" fill="#e8f6ff" />
              <polygon points="40,0 100,0 70,50" fill="#bfe6ff" />
              <polygon points="100,0 130,50 70,50" fill="#ffffff" />
              <polygon points="100,0 160,0 130,50" fill="#a9dcff" />
              <polygon points="160,0 200,50 130,50" fill="#d7efff" />
              <polygon points="0,50 70,50 100,170" fill="#8fcdf5" />
              <polygon points="70,50 130,50 100,170" fill="#cdeeff" />
              <polygon points="130,50 200,50 100,170" fill="#6fb8e8" />
            </svg>
            <div class="spark" style="left: 120px; top: 150px"></div>
            <div class="spark" style="left: 590px; top: 110px"></div>
            <div class="spark" style="left: 560px; top: 470px"></div>
            <div class="spark" style="left: 170px; top: 440px"></div>
          </div>
          <div id="lux-caption" class="caption">LUJO</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- Pantalla: entrada (0.15 s) ----------
      tl.fromTo(
        "#screen",
        { opacity: 0, scaleX: 0.5, scaleY: 0.3, y: 60 },
        { opacity: 1, scaleX: 1, scaleY: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" },
        0.15
      );

      // ---------- 1 · Corona (0.5 – 2.1 s) ----------
      tl.set("#s1", { opacity: 1 }, 0.5);
      tl.fromTo("#crown .draw", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.08 }, 0.5);
      tl.to("#crown-fill", { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.0);
      tl.fromTo(".jewel", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.04 }, 1.1);
      tl.fromTo("#crown", { scale: 0.85, y: 30 }, { scale: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.5);
      tl.to("#s1", { opacity: 0, scale: 0.9, y: -60, duration: 0.3, ease: "power2.in" }, 1.85);

      // ---------- 2 · DRO*** (2.1 – 3.5 s) ----------
      tl.set("#s2", { opacity: 1 }, 2.1);
      tl.fromTo("#letters span", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out", stagger: 0.06 }, 2.1);
      tl.fromTo("#censor", { opacity: 0, x: 120, scale: 0.8 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.35);
      tl.to("#s2", { opacity: 0, scale: 0.9, y: -60, duration: 0.3, ease: "power2.in" }, 3.25);

      // ---------- 3 · Lujo (3.5 – 4.85 s) ----------
      tl.set("#s3", { opacity: 1 }, 3.5);
      tl.fromTo("#diamond", { opacity: 0, scale: 0, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 3.5);
      tl.fromTo("#rays", { opacity: 0, scale: 0.6, rotation: 0 }, { opacity: 1, scale: 1, rotation: 40, duration: 1.4, ease: "power1.out" }, 3.55);
      tl.fromTo("#lux-caption", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.8);
      const sparkTimes = [3.75, 3.95, 4.15, 4.35];
      document.querySelectorAll(".spark").forEach((el, i) => {
        const t = sparkTimes[i];
        tl.fromTo(el, { opacity: 0, scale: 0.2, rotation: 0 }, { opacity: 1, scale: 1.4, rotation: 90, duration: 0.25, ease: "power2.out" }, t);
        tl.to(el, { opacity: 0, scale: 0.3, duration: 0.3, ease: "power2.in" }, t + 0.25);
      });

      // Reflejos del cristal
      tl.fromTo("#shine", { x: -800, skewX: -15 }, { x: 2400, skewX: -15, duration: 1.0, ease: "power2.inOut" }, 0.45);
      tl.fromTo("#shine", { x: -800, skewX: -15 }, { x: 2400, skewX: -15, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 3.45);

      // ---------- Pantalla: salida (4.85 s) ----------
      tl.to("#screen", { opacity: 0, scaleX: 0.6, scaleY: 0.4, y: 40, duration: 0.35, ease: "power2.in" }, 4.85);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
