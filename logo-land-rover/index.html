<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #040705;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, #12301f 0%, #07110b 45%, #030504 80%);
        perspective: 1600px;
      }
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 900px;
        margin: -450px 0 0 -750px;
        background: radial-gradient(ellipse at center, rgba(46, 140, 80, 0.45) 0%, rgba(46, 140, 80, 0) 60%);
        opacity: 0;
      }
      /* Ondas elípticas plateadas */
      .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1000px;
        height: 519px;
        margin: -260px 0 0 -500px;
        border-radius: 50%;
        border: 3px solid rgba(220, 230, 225, 0.8);
        opacity: 0;
      }
      #logo-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1000px;
        height: 519px;
        margin: -260px 0 0 -500px;
      }
      #logo {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6));
      }
      /* Brillo que recorre el óvalo */
      #shine-mask {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        overflow: hidden;
      }
      #shine {
        position: absolute;
        top: -30%;
        left: 0;
        width: 220px;
        height: 160%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
        mix-blend-mode: soft-light;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="glow"></div>
        <div id="ring-1" class="ring"></div>
        <div id="ring-2" class="ring"></div>
        <div id="logo-wrap">
          <img id="logo" src="assets/logo.png" alt="Land Rover" />
          <div id="shine-mask" data-layout-allow-overflow><div id="shine" data-layout-allow-overflow></div></div>
        </div>
        <div id="fade"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Entrada: el óvalo gira en 3D y se enfoca
      tl.fromTo(
        "#logo-wrap",
        { opacity: 0, scale: 0.6, rotationY: 75, filter: "blur(14px)" },
        { opacity: 1, scale: 1, rotationY: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out" },
        0.2
      );
      tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.6);

      // Ondas plateadas al "asentarse"
      tl.fromTo("#ring-1", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 1.1, ease: "power2.out" }, 1.15);
      tl.fromTo("#ring-2", { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.8, duration: 1.4, ease: "power2.out" }, 1.3);

      // Brillo metálico
      tl.fromTo("#shine", { x: -300, skewX: -18 }, { x: 1150, skewX: -18, duration: 1.0, ease: "power2.inOut" }, 1.4);
      tl.fromTo("#shine", { x: -300, skewX: -18 }, { x: 1150, skewX: -18, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 3.9);

      // Respiración lenta
      tl.to("#logo-wrap", { scale: 1.04, duration: 3.6, ease: "sine.inOut" }, 1.4);
      tl.to("#glow", { opacity: 0.6, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.8);

      // Salida
      tl.to("#fade", { opacity: 1, duration: 0.7, ease: "power1.in" }, 5.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
