<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Negro puro para poder quitar el fondo en edición */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Playfair Display", Georgia, serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: #000000;
        perspective: 1600px;
      }
      /* Hoja plana (misma posición que en los fotogramas del simulador) */
      #paper {
        position: absolute;
        left: 360px;
        top: 150px;
        width: 1200px;
        height: 780px;
        background: url("assets/papel.png");
      }

      /* ---------- Contenido impreso (se repite dentro de cada trozo) ---------- */
      .c-kicker {
        position: absolute;
        left: 0;
        right: 0;
        top: 112px;
        text-align: center;
        font-size: 34px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        color: #3d3428;
        opacity: 0;
      }
      .c-rule {
        position: absolute;
        left: 300px;
        width: 600px;
        height: 3px;
        background: #3d3428;
      }
      .c-rule.r1 {
        top: 182px;
      }
      .c-rule.r2 {
        top: 628px;
      }
      .c-date {
        position: absolute;
        left: 0;
        right: 0;
        top: 214px;
        text-align: center;
        font-size: 84px;
        font-weight: 700;
        font-style: italic;
        color: #2a241c;
      }
      .c-date span {
        display: inline-block;
        opacity: 0;
      }
      .c-year {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        text-align: center;
        font-size: 270px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #9e1b1b;
        opacity: 0;
        mix-blend-mode: multiply;
      }
      .c-foot {
        position: absolute;
        left: 0;
        right: 0;
        top: 652px;
        text-align: center;
        font-size: 30px;
        font-style: italic;
        color: #4a4034;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="paper">
          <div class="c-kicker" data-layout-allow-overlap>FIN DE LA SEGUNDA GUERRA MUNDIAL</div>
          <div class="c-rule r1"></div>
          <div class="c-date" data-layout-allow-overlap></div>
          <div class="c-year" data-layout-allow-overlap>1945</div>
          <div class="c-rule r2"></div>
          <div class="c-foot" data-layout-allow-overlap>Rendición de Japón · Bahía de Tokio</div>
        </div>
      </div>
    </div>


    <script>
      // Parte central: la hoja ya está desplegada (el despliegue y el arrugado son
      // fotogramas del simulador tools/papel_sim.py, unidos con render_final.sh)
      const tl = gsap.timeline({ paused: true });
      const DATE = "2 de septiembre";
      document.querySelector(".c-date").innerHTML = [...DATE]
        .map((ch) => `<span>${ch === " " ? "&nbsp;" : ch}</span>`)
        .join("");

      tl.to(".c-kicker", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
      tl.fromTo(".c-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      [...DATE].forEach((_, j) => {
        tl.set(`.c-date span:nth-child(${j + 1})`, { opacity: 1 }, 0.4 + j * 0.045); // máquina de escribir
      });
      tl.fromTo(".c-year", { opacity: 0, scale: 1.7, rotation: -10 }, { opacity: 0.92, scale: 1, rotation: -3, duration: 0.22, ease: "power4.in" }, 1.15);
      tl.to("#paper", { x: 5, y: 3, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 1.37); // golpe del sello
      tl.to(".c-foot", { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
