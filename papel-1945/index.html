<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Negro puro para poder quitar el fondo en edición */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Playfair Display", Georgia, serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: #000000;
        perspective: 1600px;
      }
      /* Hoja de 1200x780 dividida en 6x4 trozos que se pliegan en 3D */
      #paper {
        position: absolute;
        left: 360px;
        top: 150px;
        width: 1200px;
        height: 780px;
        transform-style: preserve-3d;
      }
      .tile {
        position: absolute;
        width: 202px;
        height: 197px;
        overflow: hidden;
        backface-visibility: visible;
      }
      .sheet {
        position: absolute;
        width: 1200px;
        height: 780px;
        background: url("assets/papel.png");
      }
      .shade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }

      /* ---------- Contenido impreso (se repite dentro de cada trozo) ---------- */
      .c-kicker {
        position: absolute;
        left: 0;
        right: 0;
        top: 112px;
        text-align: center;
        font-size: 34px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        color: #3d3428;
        opacity: 0;
      }
      .c-rule {
        position: absolute;
        left: 300px;
        width: 600px;
        height: 3px;
        background: #3d3428;
      }
      .c-rule.r1 {
        top: 182px;
      }
      .c-rule.r2 {
        top: 628px;
      }
      .c-date {
        position: absolute;
        left: 0;
        right: 0;
        top: 214px;
        text-align: center;
        font-size: 84px;
        font-weight: 700;
        font-style: italic;
        color: #2a241c;
      }
      .c-date span {
        display: inline-block;
        opacity: 0;
      }
      .c-year {
        position: absolute;
        left: 0;
        right: 0;
        top: 330px;
        text-align: center;
        font-size: 270px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #9e1b1b;
        opacity: 0;
        mix-blend-mode: multiply;
      }
      .c-foot {
        position: absolute;
        left: 0;
        right: 0;
        top: 652px;
        text-align: center;
        font-size: 30px;
        font-style: italic;
        color: #4a4034;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.4"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div id="paper"></div>
      </div>
    </div>

    <template id="content">
      <div class="c-kicker" data-layout-allow-overlap data-layout-allow-occlusion>FIN DE LA SEGUNDA GUERRA MUNDIAL</div>
      <div class="c-rule r1"></div>
      <div class="c-date" data-layout-allow-overlap data-layout-allow-occlusion></div>
      <div class="c-year" data-layout-allow-overlap data-layout-allow-occlusion>1945</div>
      <div class="c-rule r2"></div>
      <div class="c-foot" data-layout-allow-overlap data-layout-allow-occlusion>Rendición de Japón · Bahía de Tokio</div>
    </template>

    <script>
      const tl = gsap.timeline({ paused: true });
      const rnd = (a, b) => {
        const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
        return x - Math.floor(x) - 0.5;
      };

      // ---------- Construir los trozos de la hoja ----------
      const COLS = 6, ROWS = 4, TW = 200, TH = 195, PW = 1200, PH = 780;
      const paper = document.getElementById("paper");
      const tpl = document.getElementById("content").innerHTML;
      const DATE = "2 de septiembre";
      const dateHTML = [...DATE].map((ch) => `<span data-layout-allow-overlap data-layout-allow-occlusion>${ch === " " ? "&nbsp;" : ch}</span>`).join("");
      const tiles = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const t = document.createElement("div");
          t.className = "tile";
          t.style.left = `${c * TW}px`;
          t.style.top = `${r * TH}px`;
          t.innerHTML = `<div class="sheet" style="left:${-c * TW}px; top:${-r * TH}px">${tpl}</div><div class="shade"></div>`;
          t.querySelector(".c-date").innerHTML = dateHTML;
          paper.appendChild(t);
          const cx = c * TW + TW / 2 - PW / 2;
          const cy = r * TH + TH / 2 - PH / 2;
          tiles.push({ el: t, shade: t.querySelector(".shade"), cx, cy, i: r * COLS + c, dist: Math.hypot(cx, cy) });
        }
      }

      // Pose "arrugada": cada trozo se recoge hacia el centro, girado en 3D
      const crumpled = (k, seed) => ({
        x: -k.cx * 0.8 + rnd(k.i, seed + 1) * 60,
        y: -k.cy * 0.8 + rnd(k.i, seed + 2) * 60,
        z: rnd(k.i, seed + 3) * 120,
        rotationX: rnd(k.i, seed + 4) * 300,
        rotationY: rnd(k.i, seed + 5) * 300,
        rotationZ: rnd(k.i, seed + 6) * 140,
        scale: 0.95 + rnd(k.i, seed + 7) * 0.25,
      });
      const flat = { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotationZ: 0, scale: 1 };
      const maxDist = Math.max(...tiles.map((k) => k.dist));

      // ---------- 1 · Bola de papel que cae (0 – 0.45 s) ----------
      tiles.forEach((k) => {
        tl.set(k.el, crumpled(k, 0), 0);
        tl.set(k.shade, { opacity: 0.35 + rnd(k.i, 50) * 0.4 }, 0);
      });
      tl.fromTo("#paper", { y: -800, scale: 0.6, rotation: -30 }, { y: 0, rotation: 8, duration: 0.45, ease: "power2.in" }, 0);
      tl.to("#paper", { y: -40, duration: 0.12, ease: "power1.out" }, 0.45);
      tl.to("#paper", { y: 0, duration: 0.1, ease: "power1.in" }, 0.58);

      // ---------- 2 · Se despliega (0.7 – 1.9 s) ----------
      const UNFOLD = 0.7;
      tl.to("#paper", { scale: 1, rotation: 0, duration: 1.1, ease: "power3.out" }, UNFOLD);
      tiles.forEach((k) => {
        const delay = (k.dist / maxDist) * 0.22; // del centro hacia los bordes
        tl.to(k.el, { ...flat, duration: 1.0, ease: "power3.out" }, UNFOLD + delay);
        tl.to(k.shade, { opacity: 0, duration: 0.8, ease: "power2.out" }, UNFOLD + delay);
      });

      // ---------- 3 · La fecha se imprime (2.0 – 3.4 s) ----------
      tl.to(".c-kicker", { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.0);
      tl.fromTo(".c-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.1);
      [...DATE].forEach((_, j) => {
        tl.set(`.c-date span:nth-child(${j + 1})`, { opacity: 1 }, 2.3 + j * 0.045); // máquina de escribir
      });
      tl.fromTo(".c-year", { opacity: 0, scale: 1.7, rotation: -10 }, { opacity: 0.92, scale: 1, rotation: -3, duration: 0.22, ease: "power4.in" }, 3.05);
      tl.to("#paper", { x: 6, y: 4, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 3.27); // golpe del sello
      tl.to(".c-foot", { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.45);

      // ---------- 4 · Se vuelve a arrugar (4.9 – 5.8 s) ----------
      const CRUMPLE = 4.9;
      tiles.forEach((k) => {
        const delay = (1 - k.dist / maxDist) * 0.25; // de los bordes hacia el centro
        tl.to(k.el, { ...crumpled(k, 100), duration: 0.7, ease: "power3.in" }, CRUMPLE + delay);
        tl.to(k.shade, { opacity: 0.35 + rnd(k.i, 150) * 0.4, duration: 0.7, ease: "power2.in" }, CRUMPLE + delay);
      });
      tl.to("#paper", { scale: 0.6, rotation: -12, duration: 0.85, ease: "power3.in" }, CRUMPLE);
      // la bola sale despedida
      tl.to("#paper", { x: 1300, y: 260, rotation: 160, duration: 0.5, ease: "power2.in" }, 5.85);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
