<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        background: #000000; /* negro puro para quitarlo en edición */
        perspective: 1600px;
      }
      /* Ondas elípticas plateadas */
      .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1000px;
        height: 519px;
        margin: -260px 0 0 -500px;
        border-radius: 50%;
        border: 3px solid rgba(220, 230, 225, 0.8);
        opacity: 0;
      }
      #logo-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1000px;
        height: 519px;
        margin: -260px 0 0 -500px;
      }
      #logo-wrap {
        transform-style: preserve-3d;
      }
      #logo,
      #logo-back {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      /* Cara trasera: el mismo logo girado 180° para que nunca se lea al revés */
      #logo-back {
        transform: rotateY(180deg);
      }
      /* Brillo que recorre el óvalo */
      #shine-mask {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        overflow: hidden;
      }
      #shine {
        position: absolute;
        top: -30%;
        left: 0;
        width: 220px;
        height: 160%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
        mix-blend-mode: soft-light;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="ring-1" class="ring"></div>
        <div id="ring-2" class="ring"></div>
        <div id="logo-wrap">
          <img id="logo" src="assets/logo.png" alt="Land Rover" />
          <img id="logo-back" src="assets/logo.png" alt="" />
          <div id="shine-mask" data-layout-allow-overflow><div id="shine" data-layout-allow-overflow></div></div>
        </div>
        <div id="fade"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Entrada: el óvalo crece de pequeño a grande mientras gira (2 vueltas)
      tl.fromTo(
        "#logo-wrap",
        { scale: 0.05, rotationY: -720 },
        { scale: 1, rotationY: 0, duration: 1.5, ease: "power3.out" },
        0.2
      );
      tl.fromTo("#logo, #logo-back", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.2);

      // Ondas plateadas al "asentarse"
      tl.fromTo("#ring-1", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 1.1, ease: "power2.out", immediateRender: false }, 1.55);
      tl.fromTo("#ring-2", { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.8, duration: 1.4, ease: "power2.out", immediateRender: false }, 1.7);

      // Brillo metálico
      tl.fromTo("#shine", { x: -300, skewX: -18 }, { x: 1150, skewX: -18, duration: 1.0, ease: "power2.inOut" }, 1.8);
      tl.fromTo("#shine", { x: -300, skewX: -18 }, { x: 1150, skewX: -18, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 3.9);

      // Respiración lenta
      tl.to("#logo-wrap", { scale: 1.04, duration: 3.5, ease: "sine.inOut" }, 1.75);

      // Salida
      tl.to("#fade", { opacity: 1, duration: 0.7, ease: "power1.in" }, 5.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
