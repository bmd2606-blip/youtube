<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Sin fondo: renderizar con --format mov o webm para conservar la transparencia */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #crown {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 840px;
        height: 580px;
        margin: -290px 0 0 -420px;
      }
      #crown .outline {
        fill: none;
        stroke: #d4af37;
        stroke-width: 5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #crown-fill {
        opacity: 0;
      }
      .jewel {
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <svg id="crown" viewBox="0 0 420 290">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7e08a" />
              <stop offset="0.5" stop-color="#d4af37" />
              <stop offset="1" stop-color="#8a6a1c" />
            </linearGradient>
          </defs>
          <g id="crown-fill">
            <path d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" fill="url(#gold)" />
            <rect x="62" y="200" width="296" height="46" rx="6" fill="url(#gold)" />
            <path d="M210 8 V48 M194 24 H226" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
          </g>
          <g class="outline">
            <path class="draw" pathLength="1" d="M70 200 L45 90 L130 150 L210 60 L290 150 L375 90 L350 200 Z" />
            <rect class="draw" pathLength="1" x="62" y="200" width="296" height="46" rx="6" />
            <path class="draw" pathLength="1" d="M210 8 V48 M194 24 H226" />
          </g>
          <circle class="jewel" cx="45" cy="90" r="14" fill="#f6ecd2" />
          <circle class="jewel" cx="210" cy="60" r="14" fill="#f6ecd2" />
          <circle class="jewel" cx="375" cy="90" r="14" fill="#f6ecd2" />
          <circle class="jewel" cx="130" cy="223" r="12" fill="#b3243b" />
          <circle class="jewel" cx="210" cy="223" r="14" fill="#1f4fbf" />
          <circle class="jewel" cx="290" cy="223" r="12" fill="#b3243b" />
        </svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Corona: se dibuja el contorno, se rellena y aparecen las joyas
      tl.fromTo("#crown .draw", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut", stagger: 0.15 }, 0.2);
      tl.to("#crown-fill", { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.4);
      tl.fromTo(".jewel", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)", stagger: 0.08 }, 1.6);
      tl.fromTo("#crown", { y: 30, scale: 0.92 }, { y: 0, scale: 1, duration: 2, ease: "power3.out" }, 0.2);
      tl.to("#crown", { y: -12, duration: 3, ease: "sine.inOut" }, 2.4);

      // Salida
      tl.to("#crown", { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
