<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ---------- Tarjeta de cristal líquido ---------- */
      #card {
        position: absolute;
        left: 2250px;
        top: 90px;
        width: 1400px;
        padding: 64px 84px 70px;
        border-radius: 72px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.16) 100%);
        backdrop-filter: blur(40px) saturate(180%) brightness(0.78);
        -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(0.78);
        border: 3px solid rgba(255, 255, 255, 0.35);
        box-shadow:
          inset 0 4px 2px rgba(255, 255, 255, 0.6),
          inset 0 -3px 2px rgba(255, 255, 255, 0.15),
          0 40px 120px rgba(0, 0, 0, 0.35);
        transform-origin: 50% 50%;
      }
      #rim {
        position: absolute;
        inset: 0;
        border-radius: 72px;
        padding: 4px;
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 68%, rgba(255, 255, 255, 0.55) 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      #shine {
        position: absolute;
        top: -20%;
        left: 0;
        width: 380px;
        height: 140%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
      }
      #card {
        height: 460px;
      }
      .big-wrap {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        color: #ffffff;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      }
      .mask {
        overflow: hidden;
        padding: 8px 0 12px;
      }
      .big {
        font-size: 132px;
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 1;
        white-space: nowrap;
      }
      .big span {
        display: inline-block;
      }
      /* RANGE ROVER: empieza centrado y luego sube y se reduce */
      #t1-wrap {
        top: 150px;
        transform-origin: 50% 50%;
      }
      /* LAND ROVER: ocupa el hueco de abajo */
      #t2-wrap {
        top: 250px;
      }
      #divider {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        color: #ffffff;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      }
      .rule {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.85);
      }
      #rule-l {
        transform-origin: right center;
      }
      #rule-r {
        transform-origin: left center;
      }
      #o {
        font-family: "Playfair Display", Georgia, serif;
        font-style: italic;
        font-size: 84px;
        line-height: 1;
        margin-top: -12px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3.23"
      data-width="3840"
      data-height="2160"
    >
      <video
        id="clip"
        class="clip"
        src="assets/video/clip.mp4"
        data-start="0"
        data-duration="3.23"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio id="clip-audio" src="assets/video/clip.mp4" data-start="0" data-duration="3.23" data-track-index="10" data-volume="1"></audio>

      <div id="card" class="clip" data-start="0" data-duration="3.23" data-track-index="1">
        <div id="rim"></div>
        <div id="shine" data-layout-allow-overflow></div>
        <div id="t1-wrap" class="big-wrap">
          <div class="mask" data-layout-allow-occlusion>
            <div id="t1" class="big" data-layout-allow-occlusion><span>R</span><span>A</span><span>N</span><span>G</span><span>E</span><span>&nbsp;</span><span>R</span><span>O</span><span>V</span><span>E</span><span>R</span></div>
          </div>
        </div>
        <div id="divider">
          <div id="rule-l" class="rule"></div>
          <div id="o">o</div>
          <div id="rule-r" class="rule"></div>
        </div>
        <div id="t2-wrap" class="big-wrap">
          <div class="mask" data-layout-allow-occlusion>
            <div id="t2" class="big" data-layout-allow-occlusion><span>L</span><span>A</span><span>N</span><span>D</span><span>&nbsp;</span><span>R</span><span>O</span><span>V</span><span>E</span><span>R</span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Entrada de la tarjeta: "gota" de cristal que se expande
      tl.fromTo(
        "#card",
        { opacity: 0, scaleX: 0.55, scaleY: 0.35, y: -40 },
        { opacity: 1, scaleX: 1, scaleY: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" },
        0.1
      );
      // "RANGE ROVER" (primer tramo de voz, 0.15 s)
      tl.fromTo("#t1 span", { y: 170 }, { y: 0, duration: 0.5, ease: "power4.out", stagger: 0.03 }, 0.25);

      // "o LAND ROVER" (segundo tramo de voz, 1.35 s)
      tl.to("#t1-wrap", { y: -105, scale: 0.42, duration: 0.4, ease: "power3.inOut" }, 1.2);
      tl.fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 1.5);
      tl.fromTo("#o", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 1.5);
      tl.fromTo("#t2 span", { y: 170 }, { y: 0, duration: 0.5, ease: "power4.out", stagger: 0.03 }, 1.55);

      // Reflejo y flotación
      tl.fromTo("#shine", { x: -600, skewX: -15 }, { x: 1800, skewX: -15, duration: 1.1, ease: "power2.inOut" }, 2.1);
      tl.to("#card", { y: -14, duration: 2.2, ease: "sine.inOut" }, 1.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
